  <circle cx="205" cy="260" r="60" fill="none" stroke="#ed705f" stroke-width="20" stroke-dasharray="60 380" stroke-dashoffset="-200" transform="rotate(-90 205 260)"/>
  <circle cx="205" cy="260" r="60" fill="none" stroke="#c98a2d" stroke-width="20" stroke-dasharray="40 380" stroke-dashoffset="-260" transform="rotate(-90 205 260)"/>
  <circle cx="205" cy="260" r="60" fill="none" stroke="#7c5cc9" stroke-width="20" stroke-dasharray="30 380" stroke-dashoffset="-300" transform="rotate(-90 205 260)"/>
  <circle cx="205" cy="260" r="40" fill="#0e1513"/>
