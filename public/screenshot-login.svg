<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1513"/>
      <stop offset="50%" style="stop-color:#111d1a"/>
      <stop offset="100%" style="stop-color:#0e1513"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#286c56"/>
      <stop offset="100%" style="stop-color:#219368"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2f28"/>
      <stop offset="100%" style="stop-color:#12201c"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Background decoration -->
  <circle cx="400" cy="250" r="200" fill="#286c56" opacity="0.05"/>
  <circle cx="400" cy="250" r="150" fill="#219368" opacity="0.03"/>
  
  <!-- Logo -->
  <rect x="320" y="100" width="160" height="160" rx="30" fill="url(#accent)"/>
  <text x="400" y="200" font-family="'Segoe UI', sans-serif" font-size="80" fill="#d9f348" text-anchor="middle">r</text>
  <text x="455" y="170" font-family="'Segoe UI', sans-serif" font-size="32" fill="#fbfcfa" font-weight="700">ruangsaku</text>
  <text x="400" y="260" font-family="'Segoe UI', sans-serif" font-size="14" fill="#8ca39e" text-anchor="middle">Aplikasi Keuangan Pribadi</text>
  
  <!-- Login Card -->
  <rect x="180" y="280" width="440" height="200" rx="16" fill="url(#cardGrad)" stroke="#1a2f28"/>
  
  <!-- Google Sign In Button -->
  <rect x="210" y="305" width="380" height="50" rx="12" fill="#ffffff" stroke="none"/>
  <circle cx="240" cy="330" r="16" fill="#4285F4"/>
  <text x="240" y="335" font-family="'Segoe UI', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">G</text>
  <text x="270" y="328" font-family="'Segoe UI', sans-serif" font-size="14" fill="#333">Masuk dengan Google</text>
  <text x="270" y="345" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666">Login dengan akun Google Anda</text>
  
  <!-- Divider -->
  <line x1="210" y1="370" x2="590" y2="370" stroke="#1a2f28"/>
  <text x="400" y="365" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8ca39e" text-anchor="middle">atau</text>
  
  <!-- PIN Input -->
  <text x="210" y="395" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8ca39e">Masukkan PIN</text>
  <rect x="210" y="410" width="380" height="45" rx="10" fill="#0e1513"/>
  <rect x="225" y="422" width="35" height="22" rx="5" fill="#1a2f28"/>
  <rect x="265" y="422" width="35" height="22" rx="5" fill="#1a2f28"/>
  <rect x="305" y="422" width="35" height="22" rx="5" fill="#1a2f28"/>
  <rect x="345" y="422" width="35" height="22" rx="5" fill="#1a2f28"/>
  <rect x="385" y="422" width="35" height="22" rx="5" fill="#1a2f28"/>
  <rect x="425" y="422" width="35" height="22" rx="5" fill="#1a2f28"/>
  <text x="640" y="438" font-family="'Segoe UI', sans-serif" font-size="12" fill="#286c56">👆</text>
  
  <!-- Bottom -->
  <rect x="210" y="470" width="380" height="25" rx="12" fill="url(#accent)"/>
  <text x="400" y="487" font-family="'Segoe UI', sans-serif" font-size="14" fill="#fbfcfa" text-anchor="middle" font-weight="600">Masuk</text>
  
  <!-- Lock icon -->
  <rect x="640" y="435" width="30" height="30" rx="6" fill="#1a2f28"/>
  <path d="M645 443 L652 443 L652 450 L645 450 Z" fill="#8ca39e"/>
  <ellipse cx="648.5" cy="453" rx="6" ry="4" fill="#8ca39e"/>
  
  <!-- Footer -->
  <text x="400" y="510" font-family="'Segoe UI', sans-serif" font-size="9" fill="#8ca39e" text-anchor="middle">© 2026 Ruang Saku • Secure • Fast • Private</text>
</svg>
