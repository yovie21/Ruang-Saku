  <rect x="600" y="280" width="30" height="120" rx="4" fill="#219368" opacity="0.8"/>
  
  <rect x="405" y="350" width="30" height="50" rx="4" fill="#ed705f" opacity="0.4"/>
  <rect x="445" y="345" width="30" height="55" rx="4" fill="#ed705f" opacity="0.4"/>
  <rect x="485" y="335" width="30" height="65" rx="4" fill="#ed705f" opacity="0.4"/>
  <rect x="525" y="325" width="30" height="75" rx="4" fill="#ed705f" opacity="0.4"/>
  <rect x="565" y="330" width="30" height="70" rx="4" fill="#ed705f" opacity="0.4"/>
  <rect x="605" y="315" width="30" height="85" rx="4" fill="#ed705f" opacity="0.4"/>
  
