  <text x="100" y="460" font-family="'Segoe UI', sans-serif" font-size="12" fill="#fbfcfa">📊 Rekonsiliasi: Saldo total = Rp 12.45M ✓ Terverifikasi</text>
  <text x="500" y="460" font-family="'Segoe UI', sans-serif" font-size="12" fill="#219368">29.5% net rate • Baik</text>
  
  <!-- Footer -->
