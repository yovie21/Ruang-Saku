  <text x="415" y="400" font-family="'Segoe UI', sans-serif" font-size="9" fill="#8ca39e" text-anchor="middle">Jan</text>
  <text x="455" y="400" font-family="'Segoe UI', sans-serif" font-size="9" fill="#8ca39e" text-anchor="middle">Feb</text>
  <text x="495" y="400" font-family="'Segoe UI', sans-serif" font-size="9" fill="#8ca39e" text-anchor="middle">Mar</text>
  <text x="535" y="400" font-family="'Segoe UI', sans-serif" font-size="9" fill="#8ca39e" text-anchor="middle">Apr</text>
  <text x="575" y="400" font-family="'Segoe UI', sans-serif" font-size="9" fill="#8ca39e" text-anchor="middle">Mei</text>
  <text x="615" y="400" font-family="'Segoe UI', sans-serif" font-size="9" fill="#8ca39e" text-anchor="middle">Jun</text>
  
